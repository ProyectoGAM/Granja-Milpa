rules:
  - id: gam-php-interpolated-sql
    languages: [php]
    severity: WARNING
    message: Revisar que el SQL use parámetros separados del texto de la consulta.
    patterns:
      - pattern-either:
          - pattern: DB::select($LEFT . $RIGHT, ...)
          - pattern: DB::statement($LEFT . $RIGHT, ...)
          - pattern: $QUERY->whereRaw($LEFT . $RIGHT, ...)
  - id: gam-php-shell
    languages: [php]
    severity: ERROR
    message: Usar una API de procesos con argumentos separados del comando.
    pattern-either:
      - pattern: shell_exec($LEFT . $RIGHT)
      - pattern: exec($LEFT . $RIGHT, ...)
      - pattern: system($LEFT . $RIGHT, ...)
  - id: gam-php-eval
    languages: [php]
    severity: ERROR
    message: Evitar ejecutar texto como código PHP.
    pattern: eval($CODE)
  - id: gam-php-unserialize
    languages: [php]
    severity: WARNING
    message: Revisar el origen y las clases permitidas al deserializar datos.
    pattern: unserialize($DATA, ...)
  - id: gam-php-tls-disabled
    languages: [php]
    severity: ERROR
    message: Mantener la verificación TLS habilitada.
    pattern-either:
      - pattern: curl_setopt($CURL, CURLOPT_SSL_VERIFYPEER, false)
      - pattern: curl_setopt($CURL, CURLOPT_SSL_VERIFYHOST, 0)
  - id: gam-php-debug-output
    languages: [php]
    severity: WARNING
    message: Evitar la exposición de configuración y detalles del runtime.
    pattern: phpinfo(...)
